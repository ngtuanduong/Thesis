<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Times New Roman', serif; }
.container { max-width: 720px; margin: 0 auto; }
.caption { text-align: center; font-size: 12pt; margin-top: 10px; font-style: italic; }
.caption .label { font-weight: bold; font-style: italic; }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label, svg rect + text, svg [font-weight="bold"] {
  stroke-width: 0;  /* Don't apply halo to state box labels */
}
</style>
</head>
<body>
<div class="container">
<svg width="700" height="430" viewBox="0 0 700 430">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <linearGradient id="curve-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">FSRS Retrievability Decay with Increasing Stability</text>

  <!-- Chart area -->
  <g transform="translate(70, 40)">
    <!-- Axes -->
    <line x1="0" y1="300" x2="580" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
    <line x1="0" y1="300" x2="0" y2="0" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>

    <!-- Y axis labels -->
    <text x="-10" y="305" text-anchor="end" font-size="10" fill="#555">0.0</text>
    <text x="-10" y="245" text-anchor="end" font-size="10" fill="#555">0.2</text>
    <text x="-10" y="185" text-anchor="end" font-size="10" fill="#555">0.4</text>
    <text x="-10" y="125" text-anchor="end" font-size="10" fill="#555">0.6</text>
    <text x="-10" y="65" text-anchor="end" font-size="10" fill="#555">0.8</text>
    <text x="-10" y="5" text-anchor="end" font-size="10" fill="#555">1.0</text>
    <text x="-45" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" transform="rotate(-90,-45,155)">Retrievability R(t)</text>

    <!-- Y grid lines -->
    <line x1="0" y1="240" x2="570" y2="240" stroke="#eee" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="570" y2="180" stroke="#eee" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="570" y2="120" stroke="#eee" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="570" y2="60" stroke="#eee" stroke-width="0.5"/>

    <!-- X axis labels (days) -->
    <text x="0" y="318" text-anchor="middle" font-size="10" fill="#555">0</text>
    <text x="95" y="318" text-anchor="middle" font-size="10" fill="#555">5</text>
    <text x="190" y="318" text-anchor="middle" font-size="10" fill="#555">10</text>
    <text x="285" y="318" text-anchor="middle" font-size="10" fill="#555">15</text>
    <text x="380" y="318" text-anchor="middle" font-size="10" fill="#555">20</text>
    <text x="475" y="318" text-anchor="middle" font-size="10" fill="#555">25</text>
    <text x="570" y="318" text-anchor="middle" font-size="10" fill="#555">30</text>
    <text x="285" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Elapsed Time (days)</text>

    <!-- R = 0.9 threshold line -->
    <line x1="0" y1="30" x2="570" y2="30" stroke="#e65100" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="575" y="28" font-size="9" fill="#e65100" font-weight="bold">R = 0.9 (review threshold)</text>

    <!-- Curve 1: S = 1 day (red, steep decay) -->
    <!-- R(t,1) = (1 + t/9)^(-1) -->
    <!-- t=0: 1.0, t=1: 0.9, t=2: 0.818, t=5: 0.643, t=10: 0.474, t=15: 0.375, t=20: 0.310, t=30: 0.231 -->
    <polyline points="0,0 19,30 38,54.6 57,73.2 76,88.2 95,107.1 114,122.4 133,135.6 152,146.4 190,163.8 228,177.6 285,195 380,213 475,225 570,231" fill="none" stroke="#c62828" stroke-width="2.5"/>
    <!-- Review at t=1 -->
    <circle cx="19" cy="30" r="5" fill="#c62828"/>
    <text x="30" y="25" font-size="9" fill="#c62828" font-weight="bold">S=1d</text>

    <!-- Curve 2: S = 3 days (orange, moderate decay) -->
    <!-- R(t,3) = (1 + t/27)^(-1) -->
    <!-- t=0: 1.0, t=3: 0.9, t=5: 0.844, t=10: 0.730, t=15: 0.643, t=20: 0.574, t=30: 0.474 -->
    <polyline points="0,0 19,12 38,24 57,30 76,40.8 95,46.8 114,55.2 133,62.4 152,68.4 190,81 228,91.8 285,107.1 380,127.8 475,145.2 570,157.8" fill="none" stroke="#e65100" stroke-width="2.5"/>
    <!-- Review at t=3 -->
    <circle cx="57" cy="30" r="5" fill="#e65100"/>
    <text x="68" y="25" font-size="9" fill="#e65100" font-weight="bold">S=3d</text>

    <!-- Curve 3: S = 10 days (green, slow decay) -->
    <!-- R(t,10) = (1 + t/90)^(-1) -->
    <!-- t=0: 1.0, t=10: 0.9, t=15: 0.857, t=20: 0.818, t=30: 0.75 -->
    <polyline points="0,0 19,6 38,12 57,18 76,22.8 95,28.2 114,33 133,37.2 152,40.8 190,48 228,54.6 285,66 380,81 475,93 570,102" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <!-- Review at t=10 -->
    <circle cx="190" cy="30" r="5" fill="#ff9800"/>
    <text x="203" y="25" font-size="9" fill="#ff9800" font-weight="bold">S=10d</text>

    <!-- Curve 4: S = 30 days (dark green, very slow decay) -->
    <!-- R(t,30) = (1 + t/270)^(-1) -->
    <!-- t=0: 1.0, t=10: 0.964, t=20: 0.931, t=30: 0.9 -->
    <polyline points="0,0 19,2 38,4 57,6 76,7.8 95,9.6 114,11.4 133,13 152,14.4 190,18 228,21 285,25.2 380,33 475,39.6 570,45.6" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
    <!-- Review at t=30 -->
    <circle cx="570" cy="30" r="5" fill="#2e7d32"/>
    <text x="555" y="20" font-size="9" fill="#2e7d32" font-weight="bold">S=30d</text>

    <!-- Legend -->
    <rect x="340" y="200" width="220" height="90" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="355" y="218" font-size="10" fill="#333" font-weight="bold">Stability Progression</text>
    <line x1="355" y1="233" x2="380" y2="233" stroke="#c62828" stroke-width="2.5"/>
    <text x="390" y="237" font-size="9" fill="#555">S = 1 day (new card, first review)</text>
    <line x1="355" y1="250" x2="380" y2="250" stroke="#e65100" stroke-width="2.5"/>
    <text x="390" y="254" font-size="9" fill="#555">S = 3 days (after 2nd review)</text>
    <line x1="355" y1="267" x2="380" y2="267" stroke="#ff9800" stroke-width="2.5"/>
    <text x="390" y="271" font-size="9" fill="#555">S = 10 days (consolidating)</text>
    <line x1="355" y1="284" x2="380" y2="284" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="390" y="288" font-size="9" fill="#555">S = 30 days (well-learned)</text>

    <!-- Formula -->
    <rect x="15" y="200" width="280" height="32" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="155" y="215" text-anchor="middle" font-size="11" fill="#2e7d32" font-family="Cambria Math, serif" font-style="italic">R(t, S) = (1 + t / (9 &#215; S))<tspan font-size="8" baseline-shift="super">&#8722;1</tspan></text>
    <text x="155" y="228" text-anchor="middle" font-size="9" fill="#666">Review due at t = S (when R = 0.9)</text>
  </g>
</svg>
<div class="caption"><span class="label">Figure 4.5.</span> FSRS retrievability decay curves for four stability values. Each curve shows how recall probability decreases over time. The review threshold R = 0.9 is marked; the review is scheduled exactly at t = S days, where retrievability first drops to 0.9.</div>
</div>
</body>
</html>
