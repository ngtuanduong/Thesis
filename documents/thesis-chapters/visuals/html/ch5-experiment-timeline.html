<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Times New Roman', serif; }
.container { max-width: 900px; margin: 0 auto; }
.caption { text-align: center; font-size: 12pt; margin-bottom: 16px; }
.caption .label { font-weight: bold; }

svg { display: block; margin: 0 auto; }

.phase-box { stroke: #333; stroke-width: 1.5; rx: 6; ry: 6; }
.phase-baseline { fill: #e3f2fd; }
.phase-intervention { fill: #fff3e0; }
.phase-post { fill: #e8f5e9; }
.phase-washout { fill: #f3e5f5; }
.phase-retention { fill: #fce4ec; }

.phase-label { font-family: 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #333; }
.phase-week { font-family: 'Times New Roman', serif; font-size: 11px; fill: #666; }
.phase-detail { font-family: 'Times New Roman', serif; font-size: 10px; fill: #555; }

.arrow { fill: none; stroke: #4A90D9; stroke-width: 2; marker-end: url(#arrowhead); }
.timeline-bar { fill: #4A90D9; opacity: 0.15; }
.week-marker { font-family: 'Times New Roman', serif; font-size: 10px; fill: #999; text-anchor: middle; }

.group-label { font-family: 'Times New Roman', serif; font-size: 10px; fill: #1565c0; font-weight: bold; }
.group-e { fill: #e65100; }
.group-c { fill: #2e7d32; }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label, svg rect + text, svg [font-weight="bold"] {
  stroke-width: 0;  /* Don't apply halo to state box labels */
}
</style>
</head>
<body>
<div class="container">
<div class="caption"><span class="label">Figure 5.1.</span> Eight-Week Experiment Protocol Timeline</div>
<svg width="860" height="280" viewBox="0 0 860 280">
<defs>
<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4A90D9"/>
</marker>
</defs>

<!-- Timeline bar background -->
<rect x="40" y="55" width="780" height="170" rx="4" class="timeline-bar"/>

<!-- Week markers along top -->
<text x="80" y="48" class="week-marker">Week 1</text>
<text x="260" y="48" class="week-marker">Weeks 2-3</text>
<text x="420" y="48" class="week-marker">Weeks 4-5</text>
<text x="560" y="48" class="week-marker">Week 6</text>
<text x="680" y="48" class="week-marker">Week 7</text>
<text x="790" y="48" class="week-marker">Week 8</text>

<!-- Phase 1: Baseline -->
<rect x="40" y="65" width="120" height="100" class="phase-box phase-baseline"/>
<text x="100" y="88" text-anchor="middle" class="phase-label">Baseline</text>
<text x="100" y="105" text-anchor="middle" class="phase-detail">Day 1: Consent</text>
<text x="100" y="118" text-anchor="middle" class="phase-detail">Day 2: Pre-test</text>
<text x="100" y="131" text-anchor="middle" class="phase-detail">Day 3: Onboarding</text>
<text x="100" y="144" text-anchor="middle" class="phase-detail">+ Randomization</text>
<text x="100" y="157" text-anchor="middle" class="phase-detail">Days 4-5: Free use</text>

<!-- Arrow 1-2 -->
<line x1="162" y1="115" x2="188" y2="115" class="arrow"/>

<!-- Phase 2: Intervention -->
<rect x="190" y="65" width="250" height="100" class="phase-box phase-intervention"/>
<text x="315" y="88" text-anchor="middle" class="phase-label">Intervention Period</text>
<text x="315" y="105" text-anchor="middle" class="phase-detail">4 weeks of platform use</text>
<text x="315" y="118" text-anchor="middle" class="phase-detail">Min. 3 problems / week</text>
<text x="240" y="140" text-anchor="middle" class="phase-detail group-e" style="fill:#e65100">E: Full adaptive (5 layers)</text>
<text x="240" y="153" text-anchor="middle" class="phase-detail" style="fill:#2e7d32">C: Content-based filtering</text>
<text x="390" y="140" text-anchor="middle" class="phase-detail" style="fill:#666">6 data categories</text>
<text x="390" y="153" text-anchor="middle" class="phase-detail" style="fill:#666">logged continuously</text>

<!-- Arrow 2-3 -->
<line x1="442" y1="115" x2="468" y2="115" class="arrow"/>

<!-- Phase 3: Post-Assessment -->
<rect x="470" y="65" width="120" height="100" class="phase-box phase-post"/>
<text x="530" y="88" text-anchor="middle" class="phase-label">Post-Assessment</text>
<text x="530" y="105" text-anchor="middle" class="phase-detail">Day 1: Post-test</text>
<text x="530" y="118" text-anchor="middle" class="phase-detail">Day 2: SUS + TAM</text>
<text x="530" y="131" text-anchor="middle" class="phase-detail">Day 3: Interviews</text>
<text x="530" y="144" text-anchor="middle" class="phase-detail">(10 per group)</text>
<text x="530" y="157" text-anchor="middle" class="phase-detail">Day 5: Data export</text>

<!-- Arrow 3-4 -->
<line x1="592" y1="115" x2="618" y2="115" class="arrow"/>

<!-- Phase 4: Washout -->
<rect x="620" y="65" width="90" height="100" class="phase-box phase-washout"/>
<text x="665" y="88" text-anchor="middle" class="phase-label">Washout</text>
<text x="665" y="108" text-anchor="middle" class="phase-detail">2-week gap</text>
<text x="665" y="121" text-anchor="middle" class="phase-detail">No platform use</text>
<text x="665" y="138" text-anchor="middle" class="phase-detail" style="font-style:italic">Tests FSRS</text>
<text x="665" y="151" text-anchor="middle" class="phase-detail" style="font-style:italic">retention</text>

<!-- Arrow 4-5 -->
<line x1="712" y1="115" x2="738" y2="115" class="arrow"/>

<!-- Phase 5: Retention -->
<rect x="740" y="65" width="80" height="100" class="phase-box phase-retention"/>
<text x="780" y="88" text-anchor="middle" class="phase-label">Retention</text>
<text x="780" y="108" text-anchor="middle" class="phase-detail">10-question</text>
<text x="780" y="121" text-anchor="middle" class="phase-detail">retention test</text>
<text x="780" y="138" text-anchor="middle" class="phase-detail">Concepts with</text>
<text x="780" y="151" text-anchor="middle" class="phase-detail">P(L) >= 0.85</text>

<!-- RQ labels along bottom -->
<rect x="40" y="185" width="120" height="30" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
<text x="100" y="204" text-anchor="middle" class="phase-detail" style="font-weight:bold; fill:#1565c0">Stratification</text>

<rect x="190" y="185" width="250" height="30" rx="4" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
<text x="315" y="204" text-anchor="middle" class="phase-detail" style="font-weight:bold; fill:#e65100">RQ1 + RQ2 data collection</text>

<rect x="470" y="185" width="120" height="30" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
<text x="530" y="204" text-anchor="middle" class="phase-detail" style="font-weight:bold; fill:#2e7d32">RQ4 data</text>

<rect x="740" y="185" width="80" height="30" rx="4" fill="#fce4ec" stroke="#f48fb1" stroke-width="1"/>
<text x="780" y="204" text-anchor="middle" class="phase-detail" style="font-weight:bold; fill:#880e4f">RQ3 data</text>

<!-- Legend -->
<rect x="40" y="235" width="780" height="35" rx="4" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
<rect x="55" y="246" width="12" height="12" fill="#e65100" rx="2"/>
<text x="72" y="256" class="phase-detail" style="font-weight:bold">E = Experimental</text>
<text x="155" y="256" class="phase-detail">(5-layer adaptive)</text>
<rect x="275" y="246" width="12" height="12" fill="#2e7d32" rx="2"/>
<text x="292" y="256" class="phase-detail" style="font-weight:bold">C = Control</text>
<text x="352" y="256" class="phase-detail">(content-based filtering)</text>
<text x="530" y="256" class="phase-detail" style="fill:#999">Intent-to-treat protocol | Bonferroni-corrected comparisons (alpha' = 0.0125)</text>
</svg>
</div>
</body>
</html>
