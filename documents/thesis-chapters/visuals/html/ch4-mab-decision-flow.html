<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Times New Roman', serif; }
.container { max-width: 800px; margin: 0 auto; }
.caption { text-align: center; font-size: 12pt; margin-top: 10px; font-style: italic; }
.caption .label { font-weight: bold; font-style: italic; }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label, svg rect + text, svg [font-weight="bold"] {
  stroke-width: 0;  /* Don't apply halo to state box labels */
}
</style>
</head>
<body>
<div class="container">
<svg width="780" height="680" viewBox="0 0 780 680">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="a-white" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Hierarchical MAB Recommendation Pipeline</text>

  <!-- Stage 1: FSRS Check -->
  <rect x="240" y="45" width="300" height="55" rx="6" fill="#6a1b9a" fill-opacity="0.12" stroke="#6a1b9a" stroke-width="2"/>
  <text x="390" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">Stage 1: FSRS Review Check</text>
  <text x="390" y="82" text-anchor="middle" font-size="10" fill="#555">Query cards where Retrievability &lt; 0.9</text>

  <line x1="390" y1="100" x2="390" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decision: Critical reviews? -->
  <polygon points="390,125 490,160 390,195 290,160" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="390" y="156" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">Critical</text>
  <text x="390" y="169" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">R &lt; 0.7?</text>

  <!-- Yes: Critical reviews -->
  <line x1="490" y1="160" x2="610" y2="160" stroke="#c62828" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="545" y="152" font-size="10" fill="#c62828" font-weight="bold">Yes</text>
  <rect x="610" y="140" width="150" height="40" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="685" y="157" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">Allocate to reviews</text>
  <text x="685" y="172" text-anchor="middle" font-size="9" fill="#888">(highest priority)</text>

  <!-- No path continues down -->
  <line x1="390" y1="195" x2="390" y2="225" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="395" y="212" font-size="10" fill="#333">Remaining slots</text>

  <!-- Stage 2: Eligible Concepts -->
  <rect x="240" y="225" width="300" height="55" rx="6" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="2"/>
  <text x="390" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Stage 2: Prerequisite Filtering</text>
  <text x="390" y="262" text-anchor="middle" font-size="10" fill="#555">Keep concepts where all prereqs P(L) &#8805; 0.85</text>

  <line x1="390" y1="280" x2="390" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Filtering visual -->
  <rect x="90" y="233" width="130" height="40" rx="4" fill="#f5f5f5" stroke="#ccc"/>
  <text x="155" y="249" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">Knowledge Graph</text>
  <text x="155" y="263" text-anchor="middle" font-size="9" fill="#888">28 concepts, 45 edges</text>
  <line x1="220" y1="253" x2="238" y2="253" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <!-- Stage 3: Level 1 MAB -->
  <rect x="215" y="310" width="350" height="80" rx="6" fill="#e65100" fill-opacity="0.12" stroke="#e65100" stroke-width="2"/>
  <text x="390" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Stage 3: Level 1 MAB — Concept Selection</text>
  <text x="390" y="348" text-anchor="middle" font-size="10" fill="#555">Thompson Sampling over eligible concepts</text>

  <!-- Beta distribution illustration -->
  <text x="250" y="370" font-size="9" fill="#e65100">For each concept arm:</text>
  <text x="250" y="383" font-size="9" fill="#888" font-family="Courier New">&#952; ~ Beta(&#945;, &#946;)</text>
  <text x="410" y="370" font-size="9" fill="#e65100">Select highest sample</text>
  <text x="410" y="383" font-size="9" fill="#888" font-family="Courier New">argmax(&#952;<tspan font-size="7" baseline-shift="sub">i</tspan>)</text>

  <line x1="390" y1="390" x2="390" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 4: Level 2 MAB + ZPD -->
  <rect x="215" y="420" width="350" height="80" rx="6" fill="#880e4f" fill-opacity="0.12" stroke="#880e4f" stroke-width="2"/>
  <text x="390" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">Stage 4: Level 2 MAB — Problem Selection</text>
  <text x="390" y="458" text-anchor="middle" font-size="10" fill="#555">Thompson Sampling over ZPD-filtered problems</text>

  <!-- ZPD filter note -->
  <rect x="600" y="430" width="160" height="45" rx="4" fill="#f3e5f5" stroke="#880e4f" stroke-width="1"/>
  <text x="680" y="447" text-anchor="middle" font-size="9" fill="#880e4f" font-weight="bold">ZPD Filter (from Elo)</text>
  <text x="680" y="462" text-anchor="middle" font-size="9" fill="#888">R<tspan font-size="7" baseline-shift="sub">stu</tspan>+100 &#8804; R<tspan font-size="7" baseline-shift="sub">prob</tspan> &#8804; R<tspan font-size="7" baseline-shift="sub">stu</tspan>+300</text>
  <line x1="600" y1="452" x2="567" y2="452" stroke="#880e4f" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <!-- Recency filter note -->
  <rect x="20" y="430" width="170" height="45" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="105" y="447" text-anchor="middle" font-size="9" fill="#e65100" font-weight="bold">Recency Filter</text>
  <text x="105" y="462" text-anchor="middle" font-size="9" fill="#888">Exclude if attempted &lt;24h ago</text>
  <line x1="190" y1="452" x2="213" y2="452" stroke="#e65100" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <text x="250" y="488" font-size="9" fill="#880e4f">For each problem arm:</text>
  <text x="250" y="498" font-size="9" fill="#888" font-family="Courier New">&#952; ~ Beta(&#945;, &#946;)</text>

  <line x1="390" y1="500" x2="390" y2="530" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="270" y="530" width="240" height="50" rx="8" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="390" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Recommended Problems</text>
  <text x="390" y="568" text-anchor="middle" font-size="10" fill="#c8e6c9">N problems with reasons + metadata</text>

  <!-- Reason labels -->
  <rect x="160" y="595" width="70" height="22" rx="3" fill="#6a1b9a" fill-opacity="0.2" stroke="#6a1b9a"/>
  <text x="195" y="610" text-anchor="middle" font-size="9" fill="#6a1b9a" font-weight="bold">REVIEW</text>

  <rect x="250" y="595" width="100" height="22" rx="3" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0"/>
  <text x="300" y="610" text-anchor="middle" font-size="9" fill="#1565c0" font-weight="bold">NEW_CONCEPT</text>

  <rect x="370" y="595" width="80" height="22" rx="3" fill="#e65100" fill-opacity="0.2" stroke="#e65100"/>
  <text x="410" y="610" text-anchor="middle" font-size="9" fill="#e65100" font-weight="bold">PRACTICE</text>

  <text x="390" y="645" text-anchor="middle" font-size="10" fill="#888">Each recommendation includes: problem_id, concept, reason,</text>
  <text x="390" y="660" text-anchor="middle" font-size="10" fill="#888">expected_success, difficulty_match, problem_elo</text>
</svg>
<div class="caption"><span class="label">Figure 4.3.</span> Hierarchical MAB recommendation pipeline showing the four-stage process: FSRS review check, prerequisite filtering, Level 1 concept selection via Thompson Sampling, and Level 2 problem selection with ZPD filtering.</div>
</div>
</body>
</html>
