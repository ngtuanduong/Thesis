<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1.1 - Research Gap Venn Diagram</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 0;
    background: #fff;
    color: #222;
  }
  #tight-container {
    display: inline-block;
    width: 680px;
    padding: 5px;
    box-sizing: border-box;
  }
  .figure-container {
    text-align: center;
    margin: 0;
  }
  svg text {
    font-family: 'Times New Roman', Times, serif;
  }
  .caption {
    font-size: 15px;
    text-align: center;
    margin-top: 8px;
    line-height: 1.4;
  }
  .caption strong {
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="tight-container">
<div class="figure-container">
<svg width="680" height="480" viewBox="0 0 680 480">
  <!-- Left circle: Programming Platforms -->
  <ellipse cx="235" cy="210" rx="190" ry="160" fill="rgba(66,133,244,0.12)" stroke="#4285f4" stroke-width="2.5"/>
  <!-- Right circle: Adaptive Learning Platforms -->
  <ellipse cx="445" cy="210" rx="190" ry="160" fill="rgba(234,67,53,0.12)" stroke="#ea4335" stroke-width="2.5"/>

  <!-- Labels for left circle -->
  <text x="130" y="85" font-size="18" font-weight="bold" fill="#1a56db" text-anchor="middle">Programming</text>
  <text x="130" y="107" font-size="18" font-weight="bold" fill="#1a56db" text-anchor="middle">Platforms</text>
  <text x="130" y="145" font-size="15" fill="#444" text-anchor="middle">LeetCode</text>
  <text x="130" y="167" font-size="15" fill="#444" text-anchor="middle">HackerRank</text>
  <text x="130" y="189" font-size="15" fill="#444" text-anchor="middle">Codeforces</text>
  <text x="130" y="211" font-size="15" fill="#444" text-anchor="middle">CodeSignal</text>

  <text x="130" y="245" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="130" y="265" font-size="14" fill="#666" text-anchor="middle">Code editor + sandbox</text>
  <text x="130" y="285" font-size="14" fill="#666" text-anchor="middle">Test-case evaluation</text>
  <text x="130" y="305" font-size="14" fill="#666" text-anchor="middle">Large problem banks</text>
  <text x="130" y="328" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">No adaptation</text>

  <!-- Labels for right circle -->
  <text x="550" y="85" font-size="18" font-weight="bold" fill="#c5221f" text-anchor="middle">Adaptive Learning</text>
  <text x="550" y="107" font-size="18" font-weight="bold" fill="#c5221f" text-anchor="middle">Platforms</text>
  <text x="550" y="145" font-size="15" fill="#444" text-anchor="middle">Duolingo</text>
  <text x="550" y="167" font-size="15" fill="#444" text-anchor="middle">Khan Academy</text>
  <text x="550" y="189" font-size="15" fill="#444" text-anchor="middle">ALEKS</text>
  <text x="550" y="211" font-size="15" fill="#444" text-anchor="middle">Carnegie MATHia</text>

  <text x="550" y="245" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="550" y="265" font-size="14" fill="#666" text-anchor="middle">Knowledge tracing</text>
  <text x="550" y="285" font-size="14" fill="#666" text-anchor="middle">Difficulty calibration</text>
  <text x="550" y="305" font-size="14" fill="#666" text-anchor="middle">Spaced repetition</text>
  <text x="550" y="328" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">Not for programming</text>

  <!-- Center intersection - THIS THESIS -->
  <rect x="293" y="155" width="94" height="110" rx="10" fill="#2e7d32" fill-opacity="0.92"/>
  <text x="340" y="188" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">THIS</text>
  <text x="340" y="210" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">THESIS</text>
  <text x="340" y="237" font-size="13" fill="#e8f5e9" text-anchor="middle">BKT + Elo + MAB</text>
  <text x="340" y="254" font-size="13" fill="#e8f5e9" text-anchor="middle">+ FSRS + KG</text>

  <!-- Arrow pointing to intersection -->
  <line x1="340" y1="380" x2="340" y2="272" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Bottom label -->
  <rect x="220" y="385" width="240" height="72" rx="6" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="340" y="408" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Research Gap</text>
  <text x="340" y="428" font-size="14" fill="#444" text-anchor="middle">No system integrates adaptive</text>
  <text x="340" y="445" font-size="14" fill="#444" text-anchor="middle">sophistication with programming</text>
</svg>
</div>

<div class="caption">
  <strong>Figure 1.1.</strong> Research gap positioning. Programming platforms (left) offer domain-specific infrastructure but no adaptation. Adaptive learning platforms (right) offer sophisticated personalization but not for programming. This thesis occupies the intersection.
</div>
</div>

</body>
</html>
