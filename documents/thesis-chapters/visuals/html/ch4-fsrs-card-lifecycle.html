<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Times New Roman', serif; }
.container { max-width: 780px; margin: 0 auto; }
.caption { text-align: center; font-size: 12pt; margin-top: 10px; font-style: italic; }
.caption .label { font-weight: bold; font-style: italic; }
/* Halo opt-in — only applied to labels that we explicitly mark with class="halo".
   All transition labels are placed in clear zones so they do not need a halo. */
svg text { paint-order: stroke fill; stroke-width: 0; }
svg text.halo { stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="container">
<svg width="760" height="480" viewBox="0 0 760 480">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#222"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">FSRS Card State Lifecycle</text>

  <!-- ═══ STATE BOXES ═══ -->
  <!-- NEW -->
  <rect x="60" y="100" width="120" height="55" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2.5"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">NEW</text>
  <text x="120" y="142" text-anchor="middle" font-size="9" fill="#555">No reviews yet</text>

  <!-- LEARNING -->
  <rect x="280" y="55" width="120" height="55" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2.5"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">LEARNING</text>
  <text x="340" y="97" text-anchor="middle" font-size="9" fill="#555">Rating 1 or 2</text>

  <!-- REVIEW -->
  <rect x="280" y="180" width="120" height="55" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">REVIEW</text>
  <text x="340" y="222" text-anchor="middle" font-size="9" fill="#555">Rating 3 or 4</text>

  <!-- RELEARNING -->
  <rect x="530" y="120" width="140" height="55" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2.5"/>
  <text x="600" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">RELEARNING</text>
  <text x="600" y="162" text-anchor="middle" font-size="9" fill="#555">Failed recall (lapse)</text>

  <!-- ═══ TRANSITION PATHS (solid #222, orthogonal where possible) ═══ -->

  <!-- 1. NEW → LEARNING : orthogonal up-right, lands on LEARNING left edge at y=82 -->
  <path d="M 180 115 H 230 V 82 H 278" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2. NEW → REVIEW : orthogonal down-right, lands on REVIEW left edge at y=200 -->
  <path d="M 180 140 H 230 V 200 H 278" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. LEARNING → REVIEW : straight vertical, lands on REVIEW top -->
  <line x1="340" y1="110" x2="340" y2="178" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. REVIEW self-loop : loop below REVIEW (clear of all other paths) -->
  <path d="M 310 235 C 290 290 390 290 370 235" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 5. REVIEW → RELEARNING : curve up-right (upper track between REVIEW and RELEARNING) -->
  <path d="M 400 195 Q 470 160 528 148" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6. RELEARNING → REVIEW : curve down-left (lower track, parallel to path 5) -->
  <path d="M 530 165 Q 470 215 402 215" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 7. RELEARNING self-loop : loop on right side of RELEARNING -->
  <path d="M 670 135 C 720 130 720 165 670 160" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ═══ TRANSITION LABELS (placed in clear zones, no background rects) ═══ -->

  <!-- 1. NEW → LEARNING label : ABOVE the top horizontal segment of path 1 (y=82), in the open zone between title (y=22) and path -->
  <text x="255" y="58" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">First review</text>
  <text x="255" y="71" text-anchor="middle" font-size="9" fill="#222">rating &lt; 3</text>

  <!-- 2. NEW → REVIEW label : ABOVE the bottom horizontal segment of path 2 (y=200), in the gap between NEW (y=155) and REVIEW (y=180) -->
  <text x="255" y="170" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">First review</text>
  <text x="255" y="183" text-anchor="middle" font-size="9" fill="#222">rating &#8805; 3</text>

  <!-- 3. LEARNING → REVIEW label : just to the RIGHT of vertical line at x=340 -->
  <text x="346" y="148" text-anchor="start" font-size="9" fill="#222" font-weight="bold">rating &#8805; 3</text>

  <!-- 4. REVIEW self-loop label : INSIDE the loop arc, above the curve peak (~y=276) -->
  <text x="340" y="252" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">rating &#8805; 2</text>
  <text x="340" y="265" text-anchor="middle" font-size="9" fill="#222">(S increases)</text>

  <!-- 5. REVIEW → RELEARNING label : just ABOVE the upper curve (curve at x=465 is y≈165) -->
  <text x="465" y="145" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">rating = 1</text>
  <text x="465" y="157" text-anchor="middle" font-size="9" fill="#222">(lapse, S drops)</text>

  <!-- 6. RELEARNING → REVIEW label : just BELOW the lower curve (curve at x=465 is y≈202) -->
  <text x="465" y="224" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">rating &#8805; 2</text>
  <text x="465" y="236" text-anchor="middle" font-size="9" fill="#222">(recovered)</text>

  <!-- 7. RELEARNING self-loop label : to the RIGHT of the loop -->
  <text x="730" y="148" text-anchor="middle" font-size="9" fill="#222" font-weight="bold">rating = 1</text>

  <!-- ═══ Rating mapping panel (legend) ═══ -->
  <rect x="60" y="320" width="640" height="100" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  <text x="80" y="342" font-size="11" fill="#222" font-weight="bold">Submission-to-FSRS Rating Mapping</text>

  <text x="80" y="365" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#222">Rating 1 (Again):</tspan> Incorrect submission &#8594; concept needs re-learning
  </text>
  <text x="80" y="382" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#222">Rating 2 (Hard):</tspan> Correct but &#8805;5 min or multiple attempts &#8594; significant effort
  </text>
  <text x="80" y="399" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#222">Rating 3 (Good):</tspan> Correct, 1st attempt, 2-5 min &#8594; moderate effort
  </text>
  <text x="80" y="416" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#222">Rating 4 (Easy):</tspan> Correct, 1st attempt, &lt;2 min &#8594; strong recall
  </text>

  <!-- Scheduling note -->
  <rect x="60" y="432" width="640" height="30" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1"/>
  <text x="380" y="452" text-anchor="middle" font-size="10" fill="#222" font-weight="bold">Next review scheduled at t = S days (when R decays to 0.9)</text>
</svg>
</div>
</body>
</html>
