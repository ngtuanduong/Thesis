<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: 'Times New Roman', serif; }
.container { max-width: 780px; margin: 0 auto; }
.caption { text-align: center; font-size: 12pt; margin-top: 10px; font-style: italic; }
.caption .label { font-weight: bold; font-style: italic; }
</style>
</head>
<body>
<div class="container">
<svg width="760" height="480" viewBox="0 0 760 480">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="ar-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
    <marker id="ar-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
    <marker id="ar-o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">FSRS Card State Lifecycle</text>

  <!-- NEW state -->
  <rect x="60" y="100" width="120" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">NEW</text>
  <text x="120" y="142" text-anchor="middle" font-size="9" fill="#666">No reviews yet</text>

  <!-- LEARNING state -->
  <rect x="280" y="55" width="120" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">LEARNING</text>
  <text x="340" y="97" text-anchor="middle" font-size="9" fill="#666">Rating 1 or 2</text>

  <!-- REVIEW state -->
  <rect x="280" y="180" width="120" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="340" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">REVIEW</text>
  <text x="340" y="222" text-anchor="middle" font-size="9" fill="#666">Rating 3 or 4</text>

  <!-- RELEARNING state -->
  <rect x="530" y="120" width="140" height="55" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="600" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">RELEARNING</text>
  <text x="600" y="162" text-anchor="middle" font-size="9" fill="#666">Failed recall (lapse)</text>

  <!-- NEW -> LEARNING (rating < 3) -->
  <path d="M 180 115 Q 230 85 278 85" fill="none" stroke="#e65100" stroke-width="2" marker-end="url(#ar-o)"/>
  <text x="225" y="80" text-anchor="middle" font-size="9" fill="#e65100" font-weight="bold">First review</text>
  <text x="225" y="93" text-anchor="middle" font-size="9" fill="#e65100">rating &lt; 3</text>

  <!-- NEW -> REVIEW (rating >= 3) -->
  <path d="M 180 140 Q 230 175 278 200" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="210" y="185" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="bold">First review</text>
  <text x="210" y="198" text-anchor="middle" font-size="9" fill="#2e7d32">rating &#8805; 3</text>

  <!-- LEARNING -> REVIEW (successful) -->
  <line x1="340" y1="110" x2="340" y2="178" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="355" y="148" font-size="9" fill="#2e7d32" font-weight="bold">rating &#8805; 3</text>

  <!-- REVIEW -> REVIEW (self-loop: successful recall) -->
  <path d="M 280 225 C 240 260 240 290 280 260" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="230" y="272" text-anchor="middle" font-size="9" fill="#2e7d32">rating &#8805; 2</text>
  <text x="230" y="285" text-anchor="middle" font-size="9" fill="#2e7d32">(S increases)</text>

  <!-- REVIEW -> RELEARNING (failed) -->
  <path d="M 400 195 Q 480 155 528 148" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ar-r)"/>
  <text x="470" y="162" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">rating = 1</text>
  <text x="470" y="175" text-anchor="middle" font-size="9" fill="#c62828">(lapse, S drops)</text>

  <!-- RELEARNING -> REVIEW (recovered) -->
  <path d="M 530 170 Q 440 230 402 215" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar-g)"/>
  <text x="480" y="210" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="bold">rating &#8805; 2</text>

  <!-- RELEARNING self-loop (still failing) -->
  <path d="M 670 130 C 720 100 720 170 670 155" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="720" y="148" font-size="9" fill="#c62828">rating = 1</text>

  <!-- Rating mapping box -->
  <rect x="60" y="320" width="640" height="100" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="342" font-size="11" fill="#333" font-weight="bold">Submission-to-FSRS Rating Mapping (Novel Contribution)</text>

  <text x="80" y="365" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#c62828">Rating 1 (Again):</tspan> Incorrect submission &#8594; concept needs re-learning
  </text>
  <text x="80" y="382" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#e65100">Rating 2 (Hard):</tspan> Correct but &#8805;5 min or multiple attempts &#8594; significant effort
  </text>
  <text x="80" y="399" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#2e7d32">Rating 3 (Good):</tspan> Correct, 1st attempt, 2-5 min &#8594; moderate effort
  </text>
  <text x="80" y="416" font-size="10" fill="#555">
    <tspan font-weight="bold" fill="#1565c0">Rating 4 (Easy):</tspan> Correct, 1st attempt, &lt;2 min &#8594; strong recall
  </text>

  <!-- Scheduling note -->
  <rect x="60" y="432" width="640" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="380" y="452" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">Next review scheduled at t = S days (when R decays to 0.9)</text>
</svg>
<div class="caption"><span class="label">Figure 4.4.</span> FSRS card state lifecycle showing transitions between NEW, LEARNING, REVIEW, and RELEARNING states, with the novel submission-to-rating mapping for programming.</div>
</div>
</body>
</html>
