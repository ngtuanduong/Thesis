<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.3 - Spaced Repetition Evolution: Ebbinghaus to FSRS</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    background: #fff;
    color: #222;
  }
  .figure-container { text-align: center; margin: 20px 0; }
  .caption {
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label, svg rect + text, svg [font-weight="bold"] {
  stroke-width: 0;  /* Don't apply halo to state box labels */
}
</style>
</head>
<body>

<div class="figure-container">
<svg width="750" height="350" viewBox="0 0 750 350">
  <defs>
    <marker id="aw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <text x="375" y="25" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Evolution of Spaced Repetition Algorithms</text>

  <!-- Step 1: Ebbinghaus -->
  <rect x="20" y="55" width="130" height="90" rx="6" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="85" y="75" font-size="10" font-weight="bold" fill="#283593" text-anchor="middle">Ebbinghaus</text>
  <text x="85" y="90" font-size="9" fill="#283593" text-anchor="middle">(1885)</text>
  <text x="85" y="108" font-size="8" fill="#555" text-anchor="middle">Forgetting curve</text>
  <text x="85" y="120" font-size="8" fill="#555" text-anchor="middle">discovery</text>
  <text x="85" y="135" font-size="8" fill="#888" text-anchor="middle" font-style="italic">Theoretical only</text>

  <line x1="150" y1="100" x2="175" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Step 2: SM-2 -->
  <rect x="180" y="55" width="130" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="245" y="75" font-size="10" font-weight="bold" fill="#e65100" text-anchor="middle">SM-2</text>
  <text x="245" y="90" font-size="9" fill="#e65100" text-anchor="middle">(1990)</text>
  <text x="245" y="108" font-size="8" fill="#555" text-anchor="middle">Wozniak; fixed</text>
  <text x="245" y="120" font-size="8" fill="#555" text-anchor="middle">interval formula</text>
  <text x="245" y="135" font-size="8" fill="#888" text-anchor="middle" font-style="italic">Anki default</text>

  <line x1="310" y1="100" x2="335" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Step 3: HLR -->
  <rect x="340" y="55" width="130" height="90" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="405" y="75" font-size="10" font-weight="bold" fill="#6a1b9a" text-anchor="middle">HLR</text>
  <text x="405" y="90" font-size="9" fill="#6a1b9a" text-anchor="middle">(2016)</text>
  <text x="405" y="108" font-size="8" fill="#555" text-anchor="middle">Settles &amp; Meeder</text>
  <text x="405" y="120" font-size="8" fill="#555" text-anchor="middle">ML-based half-life</text>
  <text x="405" y="135" font-size="8" fill="#888" text-anchor="middle" font-style="italic">Duolingo (old)</text>

  <line x1="470" y1="100" x2="495" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#aw)"/>

  <!-- Step 4: FSRS -->
  <rect x="500" y="55" width="130" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="565" y="75" font-size="10" font-weight="bold" fill="#2e7d32" text-anchor="middle">FSRS</text>
  <text x="565" y="90" font-size="9" fill="#2e7d32" text-anchor="middle">(2023)</text>
  <text x="565" y="108" font-size="8" fill="#555" text-anchor="middle">Ye; power-law</text>
  <text x="565" y="120" font-size="8" fill="#555" text-anchor="middle">forgetting, D + S</text>
  <text x="565" y="135" font-size="8" fill="#888" text-anchor="middle" font-style="italic">Duolingo (new)</text>

  <line x1="630" y1="100" x2="655" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#aw)"/>

  <!-- Step 5: This Thesis -->
  <rect x="660" y="48" width="80" height="104" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="700" y="70" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">This</text>
  <text x="700" y="85" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Thesis</text>
  <text x="700" y="103" font-size="8" fill="#e8f5e9" text-anchor="middle">FSRS for</text>
  <text x="700" y="115" font-size="8" fill="#e8f5e9" text-anchor="middle">programming</text>
  <text x="700" y="130" font-size="8" fill="#e8f5e9" text-anchor="middle">Novel rating</text>
  <text x="700" y="142" font-size="8" fill="#e8f5e9" text-anchor="middle">mapping</text>

  <!-- Innovation callout below -->
  <rect x="130" y="190" width="500" height="110" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="380" y="212" font-size="12" font-weight="bold" fill="#f57f17" text-anchor="middle">Key Innovation: Rating Mapping for Programming</text>

  <text x="160" y="238" font-size="10" fill="#333" text-anchor="start">All prior SR systems designed for flashcard recall (binary: remember/forget)</text>
  <text x="160" y="256" font-size="10" fill="#333" text-anchor="start">Programming submissions produce richer signals:</text>
  <text x="180" y="274" font-size="10" fill="#555" text-anchor="start">correctness + number of attempts + time spent + error type</text>
  <text x="160" y="292" font-size="10" fill="#2e7d32" text-anchor="start" font-weight="bold">This thesis maps these signals to FSRS ratings (1--4)</text>

  <!-- Arrow from FSRS to innovation box -->
  <line x1="565" y1="145" x2="565" y2="188" stroke="#f9a825" stroke-width="1.5" marker-end="url(#aw)"/>
</svg>
</div>

<div class="caption">
  <strong>Figure 2.3.</strong> Evolution of spaced repetition algorithms from Ebbinghaus's forgetting curve (1885) to FSRS (2023). This thesis applies FSRS to programming skill retention for the first time, requiring a novel rating mapping from code submission outcomes to FSRS review ratings.
</div>

</body>
</html>
