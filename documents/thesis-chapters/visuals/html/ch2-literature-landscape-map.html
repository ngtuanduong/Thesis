<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.1 - Literature Landscape Map</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: #fff;
    color: #222;
  }
  .figure-container { text-align: center; margin: 20px 0; }
  svg text { font-family: 'Times New Roman', Times, serif; }
  .caption {
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label,
svg rect + text,
svg [font-weight="bold"],
svg text[fill="#fff"],
svg text[fill="#FFF"],
svg text[fill="white"],
svg text[fill="#f5f5f5"],
svg text[fill="#F5F5F5"],
svg text[fill="#ebebeb"],
svg text[fill="#e0e0e0"] {
  stroke-width: 0;  /* No halo on box labels OR on light-fill text inside dark blocks */
}
</style>
</head>
<body>

<div class="figure-container">
<svg width="850" height="560" viewBox="0 0 850 560">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="30" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Literature Landscape: Six Research Streams Converging on This Thesis</text>

  <!-- Theoretical Foundations (top row) -->
  <rect x="30" y="60" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="120" y="82" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Adaptive Learning</text>
  <text x="120" y="96" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">& ITS</text>
  <text x="120" y="115" font-size="9" fill="#555" text-anchor="middle">Brusilovsky [6]</text>
  <text x="120" y="128" font-size="9" fill="#555" text-anchor="middle">Anderson et al. [3]</text>
  <text x="120" y="141" font-size="9" fill="#555" text-anchor="middle">ZPD, Flow Theory</text>

  <rect x="235" y="60" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="325" y="82" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Knowledge Tracing</text>
  <text x="325" y="100" font-size="9" fill="#555" text-anchor="middle">BKT [16], DKT [32]</text>
  <text x="325" y="113" font-size="9" fill="#555" text-anchor="middle">DKT2 [35], UKT [37]</text>
  <text x="325" y="126" font-size="9" fill="#555" text-anchor="middle">srcML-DKT [36]</text>
  <text x="325" y="141" font-size="9" fill="#888" text-anchor="middle" font-style="italic">What student knows</text>

  <rect x="440" y="60" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="530" y="82" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Elo Rating &</text>
  <text x="530" y="96" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">IRT</text>
  <text x="530" y="115" font-size="9" fill="#555" text-anchor="middle">Elo [17], Rasch [39]</text>
  <text x="530" y="128" font-size="9" fill="#555" text-anchor="middle">Pelanek [11], [38]</text>
  <text x="530" y="141" font-size="9" fill="#888" text-anchor="middle" font-style="italic">How hard each problem</text>

  <rect x="645" y="60" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="735" y="82" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Multi-Armed</text>
  <text x="735" y="96" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Bandits</text>
  <text x="735" y="115" font-size="9" fill="#555" text-anchor="middle">Thompson [18]</text>
  <text x="735" y="128" font-size="9" fill="#555" text-anchor="middle">Clement et al. [44]</text>
  <text x="735" y="141" font-size="9" fill="#888" text-anchor="middle" font-style="italic">What to teach next</text>

  <!-- Second row -->
  <rect x="135" y="200" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="225" y="222" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Spaced Repetition</text>
  <text x="225" y="240" font-size="9" fill="#555" text-anchor="middle">Ebbinghaus [29], SM-2 [46]</text>
  <text x="225" y="253" font-size="9" fill="#555" text-anchor="middle">FSRS [12], LECTOR [47]</text>
  <text x="225" y="266" font-size="9" fill="#555" text-anchor="middle">HLR (Duolingo) [10]</text>
  <text x="225" y="281" font-size="9" fill="#888" text-anchor="middle" font-style="italic">When to review</text>

  <rect x="540" y="200" width="180" height="100" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="630" y="222" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">Knowledge Graphs</text>
  <text x="630" y="236" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">& LLMs in Education</text>
  <text x="630" y="255" font-size="9" fill="#555" text-anchor="middle">Chen et al. [53], Pan [49]</text>
  <text x="630" y="268" font-size="9" fill="#555" text-anchor="middle">PyTutor [52], RAG</text>
  <text x="630" y="281" font-size="9" fill="#888" text-anchor="middle" font-style="italic">Structure + feedback</text>

  <!-- Convergence arrows to center thesis box.
       Orthogonal (right-angle) routing to avoid crossing other content blocks:
         - Top row sources drop down to channel y=180, traverse horizontally,
           then drop down through the central gap (x=315-540, between Spaced
           Repetition and Knowledge Graphs) to thesis top edge (y=370).
         - Second-row sources drop to channel y=335 (below SR/KG, above
           thesis), traverse horizontally, then drop to thesis top.
       Landing x positions are spread across thesis top (x=350..500). -->
  <path d="M 120 160 V 180 H 350 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <path d="M 325 160 V 180 H 410 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <path d="M 530 160 V 180 H 440 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <path d="M 735 160 V 180 H 500 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <path d="M 225 300 V 335 H 380 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>
  <path d="M 630 300 V 335 H 470 V 370" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arw)"/>

  <!-- Central thesis box -->
  <rect x="330" y="370" width="190" height="70" rx="10" fill="#222" stroke="#222" stroke-width="2"/>
  <text x="425" y="395" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">THIS THESIS</text>
  <text x="425" y="412" font-size="10" fill="#f5f5f5" text-anchor="middle">BKT + Elo + H-MAB</text>
  <text x="425" y="426" font-size="10" fill="#f5f5f5" text-anchor="middle">+ FSRS + KG + LLM</text>

  <!-- Gap indicators -->
  <rect x="140" y="470" width="570" height="75" rx="6" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="425" y="490" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Three Identified Gaps</text>
  <text x="200" y="510" font-size="10" fill="#555" text-anchor="start">Gap 1: No system integrates all adaptive layers</text>
  <text x="200" y="525" font-size="10" fill="#555" text-anchor="start">Gap 2: FSRS never applied to programming skills</text>
  <text x="200" y="540" font-size="10" fill="#555" text-anchor="start">Gap 3: Programming platforms lack adaptive sophistication</text>
</svg>
</div>

</body>
</html>
