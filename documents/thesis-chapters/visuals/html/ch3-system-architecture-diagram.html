<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3.1 - Platform Architecture (4-tier, high-readability)</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 10px;
    background: #fff;
    color: #222;
  }
  .figure-container { text-align: center; margin: 10px 0; }
  svg text { font-family: 'Times New Roman', Times, serif; }
  .caption {
    font-size: 14px;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<div class="figure-container">
<!-- viewBox 900×780 — tight so scale-down in doc keeps text readable.
     Large fonts relative to viewBox width (title 3%+, body 2%+) -->
<svg width="900" height="780" viewBox="0 0 900 780">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#444"/>
    </marker>
  </defs>

  <!-- ===== TITLE ===== -->
  <text x="450" y="30" font-size="28" font-weight="bold" fill="#111" text-anchor="middle">Platform Architecture</text>

  <!-- ===== TIER BANDS ===== -->
  <rect x="8"  y="50"  width="884" height="130" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="20" y="70" font-size="15" font-weight="bold" fill="#999" letter-spacing="1.5">PRESENTATION</text>

  <rect x="8"  y="200" width="884" height="110" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="20" y="220" font-size="15" font-weight="bold" fill="#999" letter-spacing="1.5">API GATEWAY</text>

  <rect x="8"  y="330" width="884" height="290" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="20" y="350" font-size="15" font-weight="bold" fill="#999" letter-spacing="1.5">COMPUTE</text>

  <rect x="8"  y="640" width="884" height="100" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="20" y="660" font-size="15" font-weight="bold" fill="#999" letter-spacing="1.5">STORAGE</text>

  <!-- ===== TIER 1: PRESENTATION ===== -->
  <circle cx="95" cy="120" r="18" fill="#222"/>
  <text x="95" y="160" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Student</text>

  <line x1="125" y1="120" x2="205" y2="120" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="210" y="75" width="440" height="90" rx="10" fill="#f5f5f5" stroke="#222" stroke-width="3"/>
  <text x="430" y="105" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">React Frontend</text>
  <text x="430" y="135" font-size="18" fill="#444" text-anchor="middle">Code Editor (Monaco) · Dashboard · Knowledge Map</text>
  <text x="430" y="158" font-size="16" fill="#888" text-anchor="middle" font-style="italic">TypeScript / React 18</text>

  <!-- ===== TIER 1 -> TIER 2 ===== -->
  <line x1="430" y1="165" x2="430" y2="228" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="450" y="200" font-size="18" fill="#333" font-weight="bold">REST</text>

  <!-- ===== TIER 2: GATEWAY ===== -->
  <rect x="240" y="230" width="420" height="80" rx="10" fill="#f5f5f5" stroke="#222" stroke-width="3"/>
  <text x="450" y="258" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">NestJS API Gateway</text>
  <text x="450" y="286" font-size="18" fill="#444" text-anchor="middle">Auth · RBAC · Routing · Submission handling · Analytics</text>

  <!-- ===== TIER 2 -> TIER 3 (branching) ===== -->
  <line x1="370" y1="310" x2="270" y2="358" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="268" y="336" font-size="18" fill="#333" font-weight="bold">Async</text>

  <line x1="530" y1="310" x2="650" y2="358" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="580" y="336" font-size="18" fill="#333" font-weight="bold">Execute code</text>

  <!-- ===== TIER 3: COMPUTE ===== -->
  <!-- AI Service outer -->
  <rect x="40" y="360" width="500" height="260" rx="10" fill="#f9f9f9" stroke="#222" stroke-width="3"/>
  <text x="290" y="388" font-size="22" font-weight="bold" fill="#222" text-anchor="middle">AI Service (FastAPI)</text>

  <!-- L5 -->
  <rect x="55" y="398" width="470" height="34" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="290" y="420" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">L5: LLM Feedback (Optional) · RAG + Socratic hints</text>

  <!-- L4 -->
  <rect x="55" y="436" width="470" height="34" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
  <text x="290" y="458" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">L4: Review Scheduler (FSRS) · Power-law forgetting</text>

  <!-- L3 -->
  <rect x="55" y="474" width="470" height="34" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
  <text x="290" y="496" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">L3: Problem Selector (H-MAB) · Thompson Sampling</text>

  <!-- L2 -->
  <rect x="55" y="512" width="470" height="34" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
  <text x="290" y="534" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">L2: Difficulty Calibrator (Elo) · Dynamic K · ZPD</text>

  <!-- L1 -->
  <rect x="55" y="550" width="470" height="34" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
  <text x="290" y="572" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">L1: Knowledge Tracer (BKT) · Per-concept mastery</text>

  <!-- KG -->
  <rect x="55" y="588" width="470" height="28" rx="5" fill="#f5f5f5" stroke="#222" stroke-width="2.2"/>
  <text x="290" y="607" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">Knowledge Graph · 28 concepts, prerequisite DAG</text>

  <!-- Docker Sandbox -->
  <rect x="570" y="360" width="300" height="180" rx="10" fill="#f3f3f3" stroke="#555" stroke-width="3"/>
  <text x="720" y="395" font-size="23" font-weight="bold" fill="#333" text-anchor="middle">Docker Sandbox</text>
  <text x="720" y="430" font-size="18" fill="#444" text-anchor="middle">Code execution (sandboxed)</text>
  <text x="720" y="460" font-size="17" fill="#555" text-anchor="middle">256 MB memory</text>
  <text x="720" y="485" font-size="17" fill="#555" text-anchor="middle">5 s CPU timeout</text>
  <text x="720" y="510" font-size="17" fill="#555" text-anchor="middle">Unprivileged, no network</text>

  <!-- Note under Docker about feedback direction -->
  <text x="720" y="570" font-size="17" fill="#666" text-anchor="middle" font-style="italic">Test results return to</text>
  <text x="720" y="595" font-size="17" fill="#666" text-anchor="middle" font-style="italic">NestJS for adaptive updates</text>

  <!-- ===== TIER 3 -> TIER 4 ===== -->
  <line x1="290" y1="620" x2="290" y2="668" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="310" y="650" font-size="18" fill="#333" font-weight="bold">State R/W</text>

  <!-- ===== TIER 4: STORAGE ===== -->
  <rect x="140" y="665" width="300" height="66" rx="10" fill="#f5f5f5" stroke="#222" stroke-width="3"/>
  <text x="290" y="695" font-size="23" font-weight="bold" fill="#222" text-anchor="middle">PostgreSQL</text>
  <text x="290" y="720" font-size="17" fill="#444" text-anchor="middle">Core + Adaptive tables</text>

  <rect x="490" y="665" width="300" height="66" rx="10" fill="#f5f5f5" stroke="#222" stroke-width="3"/>
  <text x="640" y="695" font-size="23" font-weight="bold" fill="#222" text-anchor="middle">Redis Cache</text>
  <text x="640" y="720" font-size="17" fill="#444" text-anchor="middle">State + KG cache</text>

  <line x1="440" y1="697" x2="490" y2="697" stroke="#444" stroke-width="1.8" stroke-dasharray="4,3" marker-start="url(#ab)" marker-end="url(#a)"/>
  <text x="465" y="688" font-size="15" fill="#555" text-anchor="middle">sync</text>

  <!-- ===== LEGEND (compact, bottom of canvas) ===== -->
  <line x1="40" y1="760" x2="85" y2="760" stroke="#444" stroke-width="2.5"/>
  <text x="92" y="765" font-size="16" fill="#333">Synchronous call</text>

  <line x1="250" y1="760" x2="295" y2="760" stroke="#444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="302" y="765" font-size="16" fill="#333">Async / cache</text>

  <rect x="445" y="752" width="24" height="15" rx="3" fill="#fff" stroke="#333" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="478" y="765" font-size="16" fill="#333">Optional</text>

  <text x="585" y="765" font-size="15" fill="#888" font-style="italic">Data flows top → bottom across tiers</text>
</svg>
</div>

</body>
</html>
