<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3.3 - Recommendation Flow Sequence Diagram</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    max-width: 920px;
    margin: 30px auto;
    padding: 12px;
    background: #fff;
    color: #222;
  }
  .figure-container { text-align: center; margin: 0; }
  svg text { font-family: 'Times New Roman', Times, serif; }

  /* Halo opt-in only. */
  svg text { paint-order: stroke fill; stroke-width: 0; }
  svg text.halo { stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="figure-container">
<svg width="880" height="560" viewBox="0 0 880 560">
  <defs>
    <marker id="arseq" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#222"/>
    </marker>
    <marker id="arseqr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- Diagram self-title (allowed per VISUAL-STYLE-GUIDE §4.1.1.5) -->
  <text x="440" y="22" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Recommendation Flow Sequence Diagram</text>
  <text x="440" y="40" font-size="11" fill="#555" text-anchor="middle" font-style="italic">Target: end-to-end latency &lt; 500&nbsp;ms</text>

  <!-- ===== ACTOR BOXES ===== -->
  <rect x="20" y="58" width="120" height="34" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Student</text>

  <rect x="180" y="58" width="140" height="34" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="250" y="80" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">React Client</text>

  <rect x="370" y="58" width="140" height="34" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="440" y="80" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">NestJS API</text>

  <rect x="560" y="58" width="100" height="34" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="610" y="80" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Redis</text>

  <rect x="710" y="58" width="150" height="34" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
  <text x="785" y="80" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">AI Service</text>

  <!-- ===== LIFELINES ===== -->
  <line x1="80"  y1="92" x2="80"  y2="540" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="250" y1="92" x2="250" y2="540" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="92" x2="440" y2="540" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="610" y1="92" x2="610" y2="540" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="785" y1="92" x2="785" y2="540" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 1. Student → React Client -->
  <line x1="80" y1="120" x2="248" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#arseq)"/>
  <text x="164" y="114" font-size="12" fill="#222" text-anchor="middle">Click "Get Recommendation"</text>

  <!-- 2. React Client → NestJS -->
  <line x1="250" y1="150" x2="438" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#arseq)"/>
  <text x="344" y="144" font-size="12" fill="#222" text-anchor="middle">GET /adaptive/recommend/:uid</text>

  <!-- 3. NestJS → Redis (cache check) -->
  <line x1="440" y1="184" x2="608" y2="184" stroke="#222" stroke-width="1.5" marker-end="url(#arseq)"/>
  <text x="524" y="178" font-size="12" fill="#222" text-anchor="middle">Check cache</text>

  <!-- 3b. Redis → NestJS (cache miss) -->
  <line x1="610" y1="208" x2="442" y2="208" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arseqr)"/>
  <text x="524" y="202" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Cache miss</text>

  <!-- 4. NestJS → AI Service -->
  <line x1="440" y1="240" x2="783" y2="240" stroke="#222" stroke-width="1.5" marker-end="url(#arseq)"/>
  <text x="612" y="234" font-size="12" fill="#222" text-anchor="middle">GET /adaptive/recommend/:uid</text>

  <!-- AI Service internal processing box -->
  <rect x="700" y="252" width="170" height="180" rx="4" fill="#f5f5f5" stroke="#222" stroke-width="1.2"/>
  <text x="785" y="270" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">Internal Processing</text>

  <text x="710" y="290" font-size="11" fill="#222">1. Load Knowledge Graph</text>
  <text x="710" y="305" font-size="11" fill="#222">2. Load BKT states</text>
  <text x="710" y="320" font-size="11" fill="#222">3. Load Elo ratings</text>
  <text x="710" y="335" font-size="11" fill="#222">4. Load FSRS cards</text>
  <text x="710" y="350" font-size="11" fill="#222">5. Compute eligible concepts</text>
  <text x="710" y="365" font-size="11" fill="#222">6. Check FSRS review queue</text>
  <text x="710" y="380" font-size="11" fill="#222" font-weight="bold">7. Level-1 Thompson Sampling</text>
  <text x="710" y="395" font-size="11" fill="#222">8. Filter ZPD problems</text>
  <text x="710" y="410" font-size="11" fill="#222" font-weight="bold">9. Level-2 Thompson Sampling</text>
  <text x="710" y="426" font-size="11" fill="#222" font-weight="bold">→ Ranked problem list</text>

  <!-- 5. AI Service → NestJS (return) -->
  <line x1="785" y1="450" x2="442" y2="450" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arseqr)"/>
  <text x="612" y="444" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Ranked problem list</text>

  <!-- 6. NestJS → Redis (cache result) -->
  <line x1="440" y1="476" x2="608" y2="476" stroke="#222" stroke-width="1.5" marker-end="url(#arseq)"/>
  <text x="524" y="470" font-size="12" fill="#222" text-anchor="middle">Cache result (TTL: 2 min)</text>

  <!-- 7. NestJS enrichment self-action -->
  <rect x="392" y="488" width="96" height="22" rx="3" fill="#ebebeb" stroke="#222" stroke-width="1"/>
  <text x="440" y="503" font-size="11" fill="#222" text-anchor="middle">Enrich w/ details</text>

  <!-- 8. NestJS → React Client (return) -->
  <line x1="440" y1="522" x2="252" y2="522" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arseqr)"/>
  <text x="346" y="517" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Recommendation response</text>

  <!-- 9. React Client → Student (display) -->
  <line x1="250" y1="540" x2="82" y2="540" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arseqr)"/>
  <text x="166" y="535" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Display recommendation</text>

</svg>
</div>

</body>
</html>
