<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1.1 - Research Gap Venn Diagram</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    margin: 0;
    padding: 0;
    background: #fff;
    color: #222;
  }
  #tight-container {
    display: inline-block;
    width: 780px;
    padding: 5px;
    box-sizing: border-box;
  }
  .figure-container {
    text-align: center;
    margin: 0;
  }
  svg text {
    font-family: 'Times New Roman', Times, serif;
  }
  .caption {
    font-size: 15px;
    text-align: center;
    margin-top: 8px;
    line-height: 1.4;
  }
  .caption strong {
    font-weight: bold;
  }

/* Auto-fix: text halo for readability over lines */
svg text {
  paint-order: stroke fill;
  stroke: white;
  stroke-width: 3px;
  stroke-linejoin: round;
}
svg .state-label, svg rect + text, svg [font-weight="bold"] {
  stroke-width: 0;  /* Don't apply halo to state box labels */
}
</style>
</head>
<body>
<div id="tight-container">
<div class="figure-container">
<svg width="780" height="540" viewBox="0 0 780 540">
  <!-- Left circle: Programming Platforms -->
  <ellipse cx="260" cy="230" rx="220" ry="195" fill="rgba(66,133,244,0.10)" stroke="#4285f4" stroke-width="2.5"/>
  <!-- Right circle: Adaptive Learning Platforms -->
  <ellipse cx="520" cy="230" rx="220" ry="195" fill="rgba(234,67,53,0.10)" stroke="#ea4335" stroke-width="2.5"/>

  <!-- Labels for left circle -->
  <text x="150" y="90" font-size="18" font-weight="bold" fill="#1a56db" text-anchor="middle">Programming</text>
  <text x="150" y="112" font-size="18" font-weight="bold" fill="#1a56db" text-anchor="middle">Platforms</text>
  <text x="150" y="155" font-size="15" fill="#444" text-anchor="middle">LeetCode</text>
  <text x="150" y="177" font-size="15" fill="#444" text-anchor="middle">HackerRank</text>
  <text x="150" y="199" font-size="15" fill="#444" text-anchor="middle">Codeforces</text>
  <text x="150" y="221" font-size="15" fill="#444" text-anchor="middle">CodeSignal</text>

  <text x="150" y="258" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="150" y="278" font-size="14" fill="#666" text-anchor="middle">Code editor + sandbox</text>
  <text x="150" y="298" font-size="14" fill="#666" text-anchor="middle">Test-case evaluation</text>
  <text x="150" y="318" font-size="14" fill="#666" text-anchor="middle">Large problem banks</text>
  <text x="150" y="342" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">No adaptation</text>

  <!-- Labels for right circle -->
  <text x="630" y="90" font-size="18" font-weight="bold" fill="#c5221f" text-anchor="middle">Adaptive Learning</text>
  <text x="630" y="112" font-size="18" font-weight="bold" fill="#c5221f" text-anchor="middle">Platforms</text>
  <text x="630" y="155" font-size="15" fill="#444" text-anchor="middle">Duolingo</text>
  <text x="630" y="177" font-size="15" fill="#444" text-anchor="middle">Khan Academy</text>
  <text x="630" y="199" font-size="15" fill="#444" text-anchor="middle">ALEKS</text>
  <text x="630" y="221" font-size="15" fill="#444" text-anchor="middle">Carnegie MATHia</text>

  <text x="630" y="258" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="630" y="278" font-size="14" fill="#666" text-anchor="middle">Knowledge tracing</text>
  <text x="630" y="298" font-size="14" fill="#666" text-anchor="middle">Difficulty calibration</text>
  <text x="630" y="318" font-size="14" fill="#666" text-anchor="middle">Spaced repetition</text>
  <text x="630" y="342" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">Not for programming</text>

  <!-- Center intersection - THIS THESIS -->
  <rect x="325" y="155" width="130" height="120" rx="10" fill="#2e7d32" fill-opacity="0.92"/>
  <text x="390" y="192" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">THIS</text>
  <text x="390" y="215" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">THESIS</text>
  <text x="390" y="243" font-size="13" fill="#e8f5e9" text-anchor="middle">BKT + Elo + MAB</text>
  <text x="390" y="260" font-size="13" fill="#e8f5e9" text-anchor="middle">+ FSRS + KG</text>

  <!-- Arrow pointing to intersection -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  <line x1="390" y1="420" x2="390" y2="282" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Bottom label -->
  <rect x="270" y="425" width="240" height="72" rx="6" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="390" y="450" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Research Gap</text>
  <text x="390" y="470" font-size="14" fill="#444" text-anchor="middle">No system integrates adaptive</text>
  <text x="390" y="487" font-size="14" fill="#444" text-anchor="middle">sophistication with programming</text>
</svg>
</div>

<div class="caption">
  <strong>Figure 1.1.</strong> Research gap positioning. Programming platforms (left) offer domain-specific infrastructure but no adaptation. Adaptive learning platforms (right) offer sophisticated personalization but not for programming. This thesis occupies the intersection.
</div>
</div>

</body>
</html>
