<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1.1 - Research Gap Venn Diagram</title>
<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    background: #fff;
    color: #222;
  }
  .figure-container {
    text-align: center;
    margin: 20px 0;
  }
  svg text {
    font-family: 'Times New Roman', Times, serif;
  }
  .caption {
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }
  .caption strong {
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="figure-container">
<svg width="720" height="520" viewBox="0 0 720 520">
  <!-- Left circle: Programming Platforms -->
  <ellipse cx="260" cy="230" rx="200" ry="170" fill="rgba(66,133,244,0.12)" stroke="#4285f4" stroke-width="2"/>
  <!-- Right circle: Adaptive Learning Platforms -->
  <ellipse cx="460" cy="230" rx="200" ry="170" fill="rgba(234,67,53,0.12)" stroke="#ea4335" stroke-width="2"/>

  <!-- Labels for left circle -->
  <text x="150" y="100" font-size="15" font-weight="bold" fill="#1a56db" text-anchor="middle">Programming</text>
  <text x="150" y="118" font-size="15" font-weight="bold" fill="#1a56db" text-anchor="middle">Platforms</text>
  <text x="150" y="160" font-size="12" fill="#444" text-anchor="middle">LeetCode</text>
  <text x="150" y="178" font-size="12" fill="#444" text-anchor="middle">HackerRank</text>
  <text x="150" y="196" font-size="12" fill="#444" text-anchor="middle">Codeforces</text>
  <text x="150" y="214" font-size="12" fill="#444" text-anchor="middle">CodeSignal</text>

  <text x="150" y="248" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="150" y="266" font-size="11" fill="#666" text-anchor="middle">Code editor + sandbox</text>
  <text x="150" y="282" font-size="11" fill="#666" text-anchor="middle">Test-case evaluation</text>
  <text x="150" y="298" font-size="11" fill="#666" text-anchor="middle">Large problem banks</text>
  <text x="150" y="314" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">No adaptation</text>

  <!-- Labels for right circle -->
  <text x="570" y="100" font-size="15" font-weight="bold" fill="#c5221f" text-anchor="middle">Adaptive Learning</text>
  <text x="570" y="118" font-size="15" font-weight="bold" fill="#c5221f" text-anchor="middle">Platforms</text>
  <text x="570" y="160" font-size="12" fill="#444" text-anchor="middle">Duolingo</text>
  <text x="570" y="178" font-size="12" fill="#444" text-anchor="middle">Khan Academy</text>
  <text x="570" y="196" font-size="12" fill="#444" text-anchor="middle">ALEKS</text>
  <text x="570" y="214" font-size="12" fill="#444" text-anchor="middle">Carnegie MATHia</text>

  <text x="570" y="248" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Features:</text>
  <text x="570" y="266" font-size="11" fill="#666" text-anchor="middle">Knowledge tracing</text>
  <text x="570" y="282" font-size="11" fill="#666" text-anchor="middle">Difficulty calibration</text>
  <text x="570" y="298" font-size="11" fill="#666" text-anchor="middle">Spaced repetition</text>
  <text x="570" y="314" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">Not for programming</text>

  <!-- Center intersection - THIS THESIS -->
  <rect x="305" y="175" width="110" height="110" rx="10" fill="#2e7d32" fill-opacity="0.9"/>
  <text x="360" y="210" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">THIS</text>
  <text x="360" y="228" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">THESIS</text>
  <text x="360" y="255" font-size="10" fill="#e8f5e9" text-anchor="middle">BKT + Elo + MAB</text>
  <text x="360" y="270" font-size="10" fill="#e8f5e9" text-anchor="middle">+ FSRS + KG</text>

  <!-- Arrow pointing to intersection -->
  <line x1="360" y1="400" x2="360" y2="295" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Bottom label -->
  <rect x="240" y="405" width="240" height="70" rx="6" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="360" y="425" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">Research Gap</text>
  <text x="360" y="442" font-size="11" fill="#444" text-anchor="middle">No system integrates adaptive</text>
  <text x="360" y="457" font-size="11" fill="#444" text-anchor="middle">sophistication with programming</text>
  <text x="360" y="472" font-size="11" fill="#444" text-anchor="middle">domain infrastructure</text>
</svg>
</div>

<div class="caption">
  <strong>Figure 1.1.</strong> Research gap positioning. Programming platforms (left) offer domain-specific infrastructure but no adaptation. Adaptive learning platforms (right) offer sophisticated personalization but not for programming. This thesis occupies the intersection, combining both capabilities.
</div>

</body>
</html>
