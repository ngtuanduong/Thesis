version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adaptive-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptive_learning
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adaptive-learning-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: adaptive-learning-ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adaptive_learning
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-dev-secret-key}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  model_cache:
