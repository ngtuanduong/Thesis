services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adaptive-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptive_learning
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adaptive-learning-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: adaptive-learning-backend
    working_dir: /app
    ports:
      - '3333:3000'
      - '5555:5555'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adaptive_learning?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      NODE_ENV: development
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: dev-secret-key
      CLIENT_URL: http://localhost:5173
    volumes:
      - ../server:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox:/docker/sandbox:ro
      - code_execution_temp:/tmp/code-execution
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm install && npx prisma generate && npm run start:dev"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: adaptive-learning-ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/adaptive_learning
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-dev-secret-key}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      postgres:
        condition: service_healthy

  # Prisma migration helper
  prisma-migrate:
    image: node:20-slim
    container_name: adaptive-learning-prisma
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adaptive_learning?schema=public
    volumes:
      - ../server:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "apt-get update && apt-get install -y openssl && npm install && npx prisma generate && npx prisma db push"
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  model_cache:
  code_execution_temp:
