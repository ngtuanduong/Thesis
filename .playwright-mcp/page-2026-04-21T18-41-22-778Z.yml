    - strong [ref=e73]: Figure 3.1.
    - text: Platform architecture organized into four tiers. The Presentation tier hosts the React frontend; the API Gateway tier hosts the NestJS service that routes every request; the Compute tier contains the FastAPI AI Service (with its five adaptive layers and the knowledge graph foundation) alongside the Docker sandbox that executes submitted code; and the Storage tier holds PostgreSQL (authoritative state) and Redis (cache). All inter-tier data flows are vertical; intra-tier synchronization is horizontal and dashed.